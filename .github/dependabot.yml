version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      groups:
          react:
              patterns:
                  - react
                  - react-dom
                  - '@types/react'
                  - '@types/react-dom'
          radix-ui:
              patterns:
                  - '@radix-ui/*'
          testing:
              patterns:
                  - vitest
                  - '@vitest/*'
                  - '@testing-library/*'
                  - msw
                  - '@playwright/test'
          storybook:
              patterns:
                  - storybook
                  - '@storybook/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
