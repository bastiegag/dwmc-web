name: Deploy frontend

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

concurrency:
    group: deploy-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    quality:
        name: Quality gates
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    deploy-preview:
        name: Deploy Vercel Preview
        if: >-
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        needs: quality
        runs-on: ubuntu-latest
        environment: preview
        env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Pull Preview environment
              run: vercel pull --yes --environment=preview --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

            - name: Build with Vercel
              run: vercel build --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID"

            - name: Deploy Preview
              id: deploy
              run: |
                  deployment_url="$(vercel deploy --prebuilt --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")"
                  echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
                  echo "Preview deployment: $deployment_url"

            - name: Publish Preview URL
              run: |
                  echo "Preview URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

    deploy-production:
        name: Deploy Vercel Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: quality
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Pull Production environment
              run: vercel pull --yes --environment=production --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

            - name: Build with Vercel
              run: vercel build --prod --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID"

            - name: Deploy Production
              id: deploy
              run: |
                  deployment_url="$(vercel deploy --prebuilt --prod --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")"
                  echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
                  echo "Production deployment: $deployment_url"

            - name: Publish Production URL
              run: |
                  echo "Production URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
